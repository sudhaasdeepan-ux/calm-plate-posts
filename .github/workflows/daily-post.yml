name: daily-instagram-post
on:
  schedule:
    - cron: '30 14 * * *'   # 14:30 UTC daily; change to your audience's best time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post next queued item
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: node src/post.js
      - name: Save queue status
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add content/queue.json
          git diff --cached --quiet || (git commit -m "mark post as posted" && git push)
